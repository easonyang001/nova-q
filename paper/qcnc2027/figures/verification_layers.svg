<svg xmlns="http://www.w3.org/2000/svg" width="7.16in" height="3.69933in" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="white" /><text x="20" y="30" fill="#17334a" font-family="DejaVu Sans" font-size="24" text-anchor="start" font-weight="bold">A  Data interpretation</text><polyline points="20,42 1180,42" fill="none" stroke="#b9c8d0" stroke-width="1" /><text x="20" y="243" fill="#17334a" font-family="DejaVu Sans" font-size="24" text-anchor="start" font-weight="bold">B  Requirement consistency</text><polyline points="20,255 1180,255" fill="none" stroke="#b9c8d0" stroke-width="1" /><text x="20" y="460" fill="#17334a" font-family="DejaVu Sans" font-size="24" text-anchor="start" font-weight="bold">C  External acceptance — evaluation only</text><polyline points="20,472 1180,472" fill="none" stroke="#b9c8d0" stroke-width="1" /><rect x="25" y="63" width="209" height="76" stroke="#99a7b2" fill="white" stroke-width="1.4" /><rect x="25" y="63" width="209" height="24" stroke="none" fill="#edf3f6" stroke-width="1.4" /><text x="31" y="80" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start" font-weight="bold">ID</text><text x="99" y="80" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start" font-weight="bold">value</text><text x="165" y="80" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start" font-weight="bold">unit</text><text x="31" y="105" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">v₁</text><text x="99" y="105" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">120</text><text x="165" y="105" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">people</text><text x="31" y="127" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">v₂</text><text x="99" y="127" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">80</text><text x="165" y="127" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">people</text><polyline points="25,87 234,87" fill="none" stroke="#cad3d9" stroke-width="0.7" /><polyline points="25,113 234,113" fill="none" stroke="#cad3d9" stroke-width="0.7" /><text x="25" y="164" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start" font-weight="bold">Raw-table profiles</text><text x="25" y="189" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Request + schema</text><text x="330" y="82" fill="#17334a" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Adapter</text><text x="330" y="109" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Code on full source tables</text><text x="330" y="161" fill="#087f8c" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Data Checker</text><text x="330" y="188" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Separate count / total code</text><polyline points="255,112 278,112 278,77 315,77" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="315,77 306.0,73.0 306.0,81.0" fill="#17334a" /><polyline points="278,112 278,157 315,157" fill="none" stroke="#087f8c" stroke-width="1.5" /><polygon points="315,157 306.0,153.0 306.0,161.0" fill="#087f8c" /><polyline points="640,83 710,83 710,122 750,122" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="750,122 741.0,118.0 741.0,126.0" fill="#17334a" /><polyline points="640,164 710,164 710,122 750,122" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="750,122 741.0,118.0 741.0,126.0" fill="#17334a" /><ellipse cx="775.0" cy="121.0" rx="25.0" ry="25.0" stroke="#087f8c" fill="none" stroke-width="1.4" /><text x="775" y="130" fill="#087f8c" font-family="DejaVu Sans" font-size="26" text-anchor="middle">≈</text><text x="835" y="92" fill="#17334a" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Counts + numeric totals</text><text x="835" y="120" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">0.5% tolerance; unit-scale floor</text><text x="835" y="148" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Reducible-set counts skipped</text><text x="330" y="219" fill="#647482" font-family="DejaVu Sans" font-size="18" text-anchor="start">Checker does not see Adapter code</text><text x="25" y="291" fill="#17334a" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Confirmed request</text><text x="25" y="320" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">≤ 5 sites; count once</text><text x="25" y="350" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Schema + decision IDs</text><text x="330" y="289" fill="#17334a" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Modeler</text><text x="330" y="317" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Formulation + decision keys</text><text x="330" y="369" fill="#087f8c" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Requirement Checker</text><text x="330" y="397" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Evaluator + decision sampler</text><polyline points="270,322 290,322 290,287 315,287" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="315,287 306.0,283.0 306.0,291.0" fill="#17334a" /><polyline points="290,322 290,367 315,367" fill="none" stroke="#087f8c" stroke-width="1.5" /><polygon points="315,367 306.0,363.0 306.0,371.0" fill="#087f8c" /><polyline points="642,291 710,291 710,332 750,332" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="750,332 741.0,328.0 741.0,336.0" fill="#17334a" /><polyline points="642,373 710,373 710,332 750,332" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="750,332 741.0,328.0 741.0,336.0" fill="#17334a" /><ellipse cx="775.0" cy="331.0" rx="25.0" ry="25.0" stroke="#087f8c" fill="none" stroke-width="1.4" /><text x="775" y="340" fill="#087f8c" font-family="DejaVu Sans" font-size="26" text-anchor="middle">≈</text><text x="835" y="297" fill="#17334a" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Feasibility + ranking</text><text x="835" y="325" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Fix decisions; optimize helpers</text><text x="835" y="353" fill="#17334a" font-family="DejaVu Sans" font-size="17" text-anchor="start">Timeout / unsupported: inconclusive</text><text x="835" y="381" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Also evaluate delivered decisions</text><text x="330" y="429" fill="#647482" font-family="DejaVu Sans" font-size="18" text-anchor="start">Checker does not see formulation</text><text x="25" y="510" fill="#17334a" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Frozen raw-data truth</text><text x="25" y="541" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Withheld from runtime agents</text><polyline points="303,521 351,521" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="351,521 342.0,517.0 342.0,525.0" fill="#17334a" /><text x="366" y="510" fill="#17334a" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Case-specific judge</text><text x="366" y="541" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Prepared data, model, delivery</text><polyline points="675,521 722,521" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="722,521 713.0,517.0 713.0,525.0" fill="#17334a" /><ellipse cx="765.0" cy="509.0" rx="15.0" ry="15.0" stroke="#087f8c" fill="none" stroke-width="1.4" /><text x="765" y="516" fill="#087f8c" font-family="DejaVu Sans" font-size="19" text-anchor="middle">1</text><text x="765" y="550" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="middle">Data</text><ellipse cx="900.0" cy="509.0" rx="15.0" ry="15.0" stroke="#087f8c" fill="none" stroke-width="1.4" /><text x="900" y="516" fill="#087f8c" font-family="DejaVu Sans" font-size="19" text-anchor="middle">2</text><text x="900" y="550" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="middle">Model</text><ellipse cx="1055.0" cy="509.0" rx="15.0" ry="15.0" stroke="#087f8c" fill="none" stroke-width="1.4" /><text x="1055" y="516" fill="#087f8c" font-family="DejaVu Sans" font-size="19" text-anchor="middle">3</text><text x="1055" y="550" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="middle">Delivery</text><text x="742" y="578" fill="#087f8c" font-family="DejaVu Sans" font-size="18" text-anchor="start">Joint success requires all three gates</text><text x="20" y="610" fill="#647482" font-family="DejaVu Sans" font-size="17" text-anchor="start">Runtime agreement is evidence; shared LLM/schema errors can remain. The judge is not a repair oracle.</text></svg>