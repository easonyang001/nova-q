   </g>
   <g id="text_21">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #263b43" transform="translate(289.70792 230.001498)">If annealing is infeasible or materially worse,</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #263b43" transform="translate(289.70792 239.824564)">report the conventional solution and its source.</text>
   </g>
   <g id="text_22">
