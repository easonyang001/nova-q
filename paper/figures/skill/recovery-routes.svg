<svg xmlns="http://www.w3.org/2000/svg" width="7.16in" height="3.10267in" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white" /><text x="20" y="35" fill="#17334a" font-family="DejaVu Sans" font-size="23" text-anchor="start" font-weight="bold">Versioned inputs</text><text x="20" y="63" fill="#17334a" font-family="DejaVu Sans" font-size="17" text-anchor="start">Model + data + sources</text><polyline points="20,76 255,76" fill="none" stroke="#087f8c" stroke-width="2" /><text x="305" y="35" fill="#17334a" font-family="DejaVu Sans" font-size="23" text-anchor="start" font-weight="bold">Validate</text><text x="305" y="63" fill="#17334a" font-family="DejaVu Sans" font-size="17" text-anchor="start">Contracts + checkers</text><polyline points="305,76 540,76" fill="none" stroke="#087f8c" stroke-width="2" /><text x="620" y="35" fill="#17334a" font-family="DejaVu Sans" font-size="23" text-anchor="start" font-weight="bold">Preflight / solve</text><text x="620" y="63" fill="#17334a" font-family="DejaVu Sans" font-size="17" text-anchor="start">HiGHS → bounded annealing</text><polyline points="620,76 855,76" fill="none" stroke="#087f8c" stroke-width="2" /><text x="930" y="35" fill="#17334a" font-family="DejaVu Sans" font-size="23" text-anchor="start" font-weight="bold">Evaluate</text><text x="930" y="63" fill="#17334a" font-family="DejaVu Sans" font-size="17" text-anchor="start">Constraints + objective</text><polyline points="930,76 1165,76" fill="none" stroke="#087f8c" stroke-width="2" /><polyline points="255,53 290,53" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="290,53 281.0,49.0 281.0,57.0" fill="#17334a" /><polyline points="550,53 605,53" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="605,53 596.0,49.0 596.0,57.0" fill="#17334a" /><polyline points="865,53 915,53" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="915,53 906.0,49.0 906.0,57.0" fill="#17334a" /><rect x="35" y="99" width="103" height="58" stroke="#647482" fill="white" stroke-width="1.4" /><rect x="52" y="99" width="103" height="58" stroke="#647482" fill="white" stroke-width="1.4" /><rect x="69" y="99" width="103" height="58" stroke="#647482" fill="white" stroke-width="1.4" /><text x="86" y="136" fill="#17334a" font-family="DejaVu Sans" font-size="24" text-anchor="middle">vₜ</text><text x="20" y="188" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Fixed settings protected</text><text x="305" y="124" fill="#b36b12" font-family="DejaVu Sans" font-size="20" text-anchor="start" font-weight="bold">Data mismatch</text><text x="305" y="151" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">→ revise preparation</text><text x="305" y="194" fill="#b36b12" font-family="DejaVu Sans" font-size="20" text-anchor="start" font-weight="bold">Requirement mismatch</text><text x="305" y="221" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">→ revise formulation</text><polyline points="555,124 578,124 578,270 10,270 10,140 34,140" fill="none" stroke="#b36b12" stroke-width="1.5" /><polygon points="34,140 25.0,136.0 25.0,144.0" fill="#b36b12" /><text x="195" y="263" fill="#b36b12" font-family="DejaVu Sans" font-size="18" text-anchor="start">Data / model replacement</text><polyline points="555,194 578,194" fill="none" stroke="#b36b12" stroke-width="1.5" /><text x="620" y="124" fill="#17334a" font-family="DejaVu Sans" font-size="20" text-anchor="start" font-weight="bold">Proven infeasible</text><text x="620" y="151" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">No annealer submission</text><text x="620" y="194" fill="#17334a" font-family="DejaVu Sans" font-size="20" text-anchor="start" font-weight="bold">Timeout ≠ infeasibility</text><text x="620" y="221" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Status remains unknown</text><text x="620" y="266" fill="#087f8c" font-family="DejaVu Sans" font-size="20" text-anchor="start" font-weight="bold">Feasible baseline</text><text x="620" y="293" fill="#17334a" font-family="DejaVu Sans" font-size="17" text-anchor="start">Not always an optimum</text><polyline points="869,124 903,124 903,364 950,364" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="950,364 941.0,360.0 941.0,368.0" fill="#17334a" /><text x="950" y="125" fill="#087f8c" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Usable decision</text><text x="950" y="154" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">Passes original requirements</text><text x="950" y="245" fill="#087f8c" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Validated baseline</text><text x="950" y="274" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">Annealing fails / inferior</text><text x="950" y="365" fill="#647482" font-family="DejaVu Sans" font-size="21" text-anchor="start" font-weight="bold">Unavailable / limited</text><text x="950" y="394" fill="#17334a" font-family="DejaVu Sans" font-size="16" text-anchor="start">Report the unresolved gap</text><polyline points="920,95 920,117 935,117" fill="none" stroke="#17334a" stroke-width="1.5" /><polygon points="935,117 926.0,113.0 926.0,121.0" fill="#17334a" /><polyline points="868,269 900,269 900,237 935,237" fill="none" stroke="#087f8c" stroke-width="1.5" /><polygon points="935,237 926.0,233.0 926.0,241.0" fill="#087f8c" /><polyline points="20,320 870,320" fill="none" stroke="#b9c8d0" stroke-width="1" /><text x="20" y="350" fill="#17334a" font-family="DejaVu Sans" font-size="22" text-anchor="start" font-weight="bold">Before activating a replacement</text><text x="20" y="382" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Validate on original data; confirm changed bounds or formulas.</text><text x="20" y="411" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Retain earlier usable version; tie every solution to its model/data version.</text><text x="20" y="440" fill="#17334a" font-family="DejaVu Sans" font-size="18" text-anchor="start">Finite repair attempts, solver calls and process timeouts.</text><text x="20" y="496" fill="#647482" font-family="DejaVu Sans" font-size="17" text-anchor="start">Solver failure alone does not establish a model error; penalty tuning remains a bounded inner loop.</text></svg>